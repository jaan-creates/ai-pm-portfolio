name: Janu Job Copilot Golden Score Recovery

on:
  push:
    branches:
      - janu-job-copilot/apps-script-ci
    paths:
      - '.github/janu-job-copilot-score-recovery-trigger.txt'

permissions:
  contents: read

concurrency:
  group: janu-job-copilot-golden-score-recovery
  cancel-in-progress: false

jobs:
  recover-and-run-one:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_DIR: .janu-score-recovery
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credentials
        shell: bash
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Prepare isolated runtime workspace
        shell: bash
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Confirm canonical runtime identity
        shell: bash
        run: |
          out="$(clasp show-authorized-user --user "$CLASP_USER" 2>&1)"
          printf '%s\n' "$out"
          grep -q 'You are logged in as janu.bkurup@gmail.com.' <<<"$out"
      - name: Pull exact connected production source
        working-directory: .janu-score-recovery
        run: clasp pull --user "$CLASP_USER"
      - name: Assert scoring recovery contract deployed
        shell: bash
        run: |
          grep -q 'JD-SCORE-ADMISSION-001' "$LIVE_DIR/TrackerWorkflow.js"
          grep -q 'JD-SCORE-RECOVERY-001' "$LIVE_DIR/TrackerWorkflow.js"
          grep -q 'function runJdScoreAdmissionRecovery()' "$LIVE_DIR/TrackerWorkflow.js"
      - name: Enqueue only the stranded golden scoring job
        working-directory: .janu-score-recovery
        shell: bash
        run: |
          set +e
          out="$(clasp run runJdScoreAdmissionRecovery --nondev --user "$CLASP_USER" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          ! grep -Eiq 'Unable to run script function|Script function not found|permission to run the script function|API executable|Execution API|Exception:|^Error:|Error 502|Server Error' <<<"$out"
          grep -q "contract: 'JD-SCORE-RECOVERY-001'" <<<"$out"
          grep -q "status: 'ENQUEUED'" <<<"$out"
      - name: Execute exactly one eligible worker job
        working-directory: .janu-score-recovery
        shell: bash
        run: |
          set +e
          out="$(clasp run phase1OneJobTick --nondev --user "$CLASP_USER" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          ! grep -Eiq 'Unable to run script function|Script function not found|permission to run the script function|API executable|Execution API|Exception:|^Error:|Error 502|Server Error|CIRCUIT_OPEN' <<<"$out"
          grep -q "status: 'OK'" <<<"$out"
          grep -q 'jobsProcessed: 1' <<<"$out"
