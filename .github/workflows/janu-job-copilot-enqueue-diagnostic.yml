name: Janu Job Copilot Queue Admission Diagnostic

on:
  push:
    branches:
      - janu-job-copilot/apps-script-ci
    paths:
      - '.github/workflows/janu-job-copilot-enqueue-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LIVE_DIR: .janu-live-diagnostic
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp
      - name: Prepare isolated runtime workspace
        shell: bash
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Pull target runtime
        working-directory: .janu-live-diagnostic
        run: clasp pull --user "$CLASP_USER"
      - name: Print privacy-safe queue state literals
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('.janu-live-diagnostic/TrackerWorkflow.js','utf8');
          function functionText(name){
            const sig='function '+name+'(';
            const start=s.indexOf(sig); if(start<0) return null;
            const open=s.indexOf('{',start); let d=0,q=null,e=false,line=false,block=false,end=-1;
            for(let i=open;i<s.length;i++){
              const c=s[i],n=s[i+1]||'';
              if(line){if(c==='\n')line=false;continue}
              if(block){if(c==='*'&&n==='/'){block=false;i++}continue}
              if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}
              if(c==='/'&&n==='/'){line=true;i++;continue}
              if(c==='/'&&n==='*'){block=true;i++;continue}
              if(c==='"'||c==="'"||c==='`'){q=c;continue}
              if(c==='{')d++; else if(c==='}'&&--d===0){end=i+1;break}
            }
            if(end<0) throw new Error(name+' unterminated');
            return s.slice(start,end);
          }
          const f=functionText('workNeededFromState_')||'';
          const literals=[...f.matchAll(/['"]([^'"]{0,100})['"]/g)].map(m=>m[1]).filter(x=>!/https?:|@|AIza|sk-|token|secret|key/i.test(x));
          const qma=functionText('queueMutationAllowed_')||'';
          const circuit=(qma.match(/circuitOpen_\(\s*['"]([^'"]+)['"]\s*\)/)||[])[1]||null;
          console.log(JSON.stringify({contract:'QUEUE-ADMISSION-DIAG-005',workNeededFromStateLiterals:[...new Set(literals)],circuitComponent:circuit},null,2));
          NODE
