name: Janu Job Copilot Queue Admission Diagnostic

on:
  push:
    branches:
      - janu-job-copilot/apps-script-ci
    paths:
      - '.github/workflows/janu-job-copilot-enqueue-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LIVE_DIR: .janu-live-diagnostic
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @google/clasp
      - name: Prepare isolated runtime workspace
        shell: bash
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Pull target runtime
        working-directory: .janu-live-diagnostic
        run: clasp pull --user "$CLASP_USER"
      - name: Print privacy-safe enqueue control structure
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='.janu-live-diagnostic/TrackerWorkflow.js';
          const s=fs.readFileSync(p,'utf8');
          const sig='function enqueue_(';
          const start=s.indexOf(sig); if(start<0) throw new Error('enqueue_ missing');
          const open=s.indexOf('{',start); let d=0,q=null,e=false,line=false,block=false,end=-1;
          for(let i=open;i<s.length;i++){
            const c=s[i],n=s[i+1]||'';
            if(line){if(c==='\n')line=false;continue}
            if(block){if(c==='*'&&n==='/'){block=false;i++}continue}
            if(q){if(e){e=false;continue}if(c==='\\'){e=true;continue}if(c===q)q=null;continue}
            if(c==='/'&&n==='/'){line=true;i++;continue}
            if(c==='/'&&n==='*'){block=true;i++;continue}
            if(c==='"'||c==="'"||c==='`'){q=c;continue}
            if(c==='{')d++; else if(c==='}'&&--d===0){end=i+1;break}
          }
          if(end<0) throw new Error('enqueue_ unterminated');
          const f=s.slice(start,end);
          const redacted=f.replace(/(['"`])(?:\\.|(?!\1)[\s\S])*?\1/g,'<STR>');
          const calls=[...redacted.matchAll(/\b([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1]).filter((x,i,a)=>a.indexOf(x)===i);
          const returns=[...redacted.matchAll(/return\s+([^;]{0,180})/g)].map((m,i)=>({index:i+1,expr:m[1].replace(/\s+/g,' ').trim()}));
          const conditions=[...redacted.matchAll(/if\s*\(([^)]{0,220})\)/g)].map((m,i)=>({index:i+1,expr:m[1].replace(/\s+/g,' ').trim()}));
          console.log(JSON.stringify({contract:'QUEUE-ADMISSION-DIAG-001',functionBytes:f.length,calls,conditions,returns},null,2));
          NODE
