name: Janu Apps Script CI

on:
  pull_request:
    paths:
      - 'startup-track/projects/2-janu-job-copilot/apps-script/**'
      - 'startup-track/projects/2-janu-job-copilot/scripts/**'
      - '.github/workflows/janu-apps-script-ci.yml'
  push:
    branches: [main]
    paths:
      - 'startup-track/projects/2-janu-job-copilot/apps-script/**'
      - 'startup-track/projects/2-janu-job-copilot/scripts/**'
  workflow_dispatch:

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          cp startup-track/projects/2-janu-job-copilot/apps-script/TrackerWorkflow.gs /tmp/TrackerWorkflow.js
          node --check /tmp/TrackerWorkflow.js
      - name: Release contract validation
        env:
          EXPECTED_VERSION: '1.3.2'
          EXPECTED_SUITE: 'p0-regression-v13'
        run: node startup-track/projects/2-janu-job-copilot/scripts/validate-release.mjs
