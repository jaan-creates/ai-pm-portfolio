name: Janu Job Copilot Apps Script CD

on:
  push:
    branches:
      - janu-job-copilot/apps-script-ci
    paths:
      - 'startup-track/projects/2-janu-job-copilot/**'
      - '.github/workflows/janu-job-copilot.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'startup-track/projects/2-janu-job-copilot/**'
      - '.github/workflows/janu-job-copilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janu-job-copilot-apps-script-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'janu-job-copilot/apps-script-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_VERSION: '1.3.5'
      EXPECTED_SUITE: 'p0-regression-v16'
      PROJECT_DIR: startup-track/projects/2-janu-job-copilot
      LIVE_DIR: .janu-live
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - name: Checkout isolated Job Copilot branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment credentials exist
        shell: bash
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing JANU_CLASPRC_JSON'; exit 2; }
          test -n "$CLASP_JSON" || { echo 'Missing JANU_CLASP_JSON'; exit 2; }
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Prepare ephemeral Apps Script workspace
        shell: bash
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Confirm CI clasp identity
        shell: bash
        run: clasp show-authorized-user --user "$CLASP_USER"
      - name: Pull current production Apps Script
        working-directory: .janu-live
        run: clasp pull --user "$CLASP_USER"
      - name: Apply deterministic v16 release patch
        run: node "$PROJECT_DIR/scripts/patch-live-source.mjs" "$LIVE_DIR"
      - name: JavaScript syntax validation
        shell: bash
        run: |
          find "$LIVE_DIR" -maxdepth 1 -type f \( -name '*.gs' -o -name '*.js' \) -print0 | sort -z | xargs -0 cat > /tmp/janu-job-copilot-combined.js
          test -s /tmp/janu-job-copilot-combined.js
          node --check /tmp/janu-job-copilot-combined.js
      - name: Full release-contract validation
        shell: bash
        run: |
          set -o pipefail
          node "$PROJECT_DIR/scripts/validate-release.mjs" "$LIVE_DIR" | tee /tmp/janu-release-validation.json
          grep -q "BOOTSTRAP-005" /tmp/janu-job-copilot-combined.js || { echo 'BOOTSTRAP-005 missing'; exit 3; }
          grep -q "SCHEDULE_REPLACEMENT" /tmp/janu-job-copilot-combined.js || { echo 'FL-031 replacement contract missing'; exit 4; }
          grep -q "CONTROL-002" /tmp/janu-job-copilot-combined.js || { echo 'CONTROL-002 missing'; exit 5; }
      - name: Push validated source to Apps Script production project
        working-directory: .janu-live
        run: clasp push --force --user "$CLASP_USER"
      - name: Execute queued release-control command
        working-directory: .janu-live
        run: clasp run-function phase1HealthTick --user "$CLASP_USER"
      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo '## Janu Job Copilot Apps Script deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '- Target release: 1.3.5 / p0-regression-v16' >> "$GITHUB_STEP_SUMMARY"
          echo '- FL-031: every closure lock collision schedules a fresh future continuation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- CONTROL-002: release commands remain reachable from the scheduled health trigger while broad worker is gated.' >> "$GITHUB_STEP_SUMMARY"
          echo '- CI post-deploy probe executes phase1HealthTick to consume a queued allow-listed release command when API execution is available.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No other ai-pm-portfolio project directories are read or modified.' >> "$GITHUB_STEP_SUMMARY"
