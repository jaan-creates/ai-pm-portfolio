name: Janu Job Copilot Apps Script CD

on:
  push:
    branches:
      - main
      - janu-job-copilot/apps-script-ci
      - janu-job-copilot/p1a-release
    paths:
      - 'startup-track/projects/2-janu-job-copilot/scripts/**'
      - 'startup-track/projects/2-janu-job-copilot/runtime/**'
      - '.github/workflows/janu-job-copilot.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'startup-track/projects/2-janu-job-copilot/scripts/**'
      - 'startup-track/projects/2-janu-job-copilot/runtime/**'
      - '.github/workflows/janu-job-copilot.yml'
  workflow_dispatch:
    inputs:
      verify_run:
        description: 'Verify an already pushed candidate after approved pin promotion (original run ID)'
        required: false
        type: string
      verify_attempt:
        description: 'Original candidate run attempt'
        required: false
        type: string
      verify_hash:
        description: 'fullProjectSha256 from the original push manifest (script, HTML and manifest)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: janu-job-copilot-apps-script-production
  cancel-in-progress: false

jobs:
  release-readiness-probe:
    if: github.event_name != 'workflow_dispatch' || (inputs.verify_run == '' && inputs.verify_attempt == '' && inputs.verify_hash == '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release credential availability
        shell: bash
        run: test -n "$CLASPRC_JSON" && test -n "$CLASP_JSON"
      - name: Install release CLI
        run: npm install --global @google/clasp@3.4.1
      - name: Pull live preimage without mutation
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .janu-readonly
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .janu-readonly/.clasp.json
          (cd .janu-readonly && clasp pull)
          node startup-track/projects/2-janu-job-copilot/scripts/validate-release.mjs .janu-readonly
      - name: Probe live script execution authority without worker mutation
        shell: bash
        run: |
          set -euo pipefail
          (cd .janu-readonly && clasp --json run runRendererCanaryControlStatus --params '[]') > /tmp/janu-readonly-probe.json
          node - <<'NODE'
          const fs=require('fs'),raw=fs.readFileSync('/tmp/janu-readonly-probe.json','utf8');
          let result;try{result=JSON.parse(raw)}catch{throw Error('Release credential cannot execute the read-only live diagnostic')}
          if(result.error||!result.response||result.response.contract!=='CANARY-SCHEDULER-HANDOFF-001')throw Error('Read-only live diagnostic returned no control status');
          console.log('Release credential pulled live source and read control status successfully');
          NODE
      - name: Snapshot canonical API pin without mutation
        shell: bash
        run: |
          set -euo pipefail
          (cd .janu-readonly && node "$GITHUB_WORKSPACE/startup-track/projects/2-janu-job-copilot/scripts/manage-canonical-pin.mjs" snapshot /tmp/janu-readonly-pin.json)
  deploy-production:
    needs: release-readiness-probe
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["main","janu-job-copilot/apps-script-ci","janu-job-copilot/p1a-release"]'), github.ref_name) && inputs.verify_run == '' && inputs.verify_attempt == '' && inputs.verify_hash == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_VERSION: '1.3.8'
      EXPECTED_SUITE: 'p0-regression-v19'
      PROJECT_DIR: startup-track/projects/2-janu-job-copilot
      LIVE_DIR: .janu-live
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
    steps:
      - name: Checkout isolated Job Copilot branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch machinery syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=("$PROJECT_DIR"/scripts/*.mjs)
          test ${#files[@]} -gt 0 || { echo 'No Job Copilot patch/validation scripts found'; exit 2; }
          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Verify deployment credentials exist
        shell: bash
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing JANU_CLASPRC_JSON'; exit 2; }
          test -n "$CLASP_JSON" || { echo 'Missing JANU_CLASP_JSON'; exit 2; }
      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Prepare ephemeral Apps Script workspace
        shell: bash
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Confirm CI clasp identity
        run: clasp show-authorized-user
      - name: Pull current production Apps Script
        working-directory: .janu-live
        run: clasp pull
      - name: Snapshot pre-deploy source for in-run rollback
        shell: bash
        run: |
          backup="$(mktemp -d)"
          node "$PROJECT_DIR/scripts/check-source-snapshot.mjs" --backup "$LIVE_DIR" "$backup"
          echo "JANU_PREIMAGE=$backup" >> "$GITHUB_ENV"
      - name: Snapshot canonical API executable for rollback
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/janu-canonical-pin.json"
          (cd "$LIVE_DIR" && node "$GITHUB_WORKSPACE/$PROJECT_DIR/scripts/manage-canonical-pin.mjs" snapshot "$state")
          echo "JANU_PIN_STATE=$state" >> "$GITHUB_ENV"
      - name: Assert accepted P0 baseline
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('.janu-live/TrackerWorkflow.js','utf8');
          const p=s.match(/P12\s*=\s*Object\.freeze\(\{[\s\S]*?VERSION\s*:\s*['"]([^'"]+)['"][\s\S]*?SUITE\s*:\s*['"]([^'"]+)['"]/);
          if(!p) throw new Error('Unable to read live P12 release identity');
          const version=p[1],suite=p[2];
          if(version!=='1.3.8'||suite!=='p0-regression-v19') throw new Error(`P1 blocked: expected live 1.3.8 / p0-regression-v19, found ${version} / ${suite}`);
          console.log(JSON.stringify({baseline:'PASS',version,suite}));
          NODE
      - name: Inspect safe live integration manifest
        run: node "$PROJECT_DIR/scripts/live-source-manifest.mjs" "$LIVE_DIR"
      - name: Inspect safe target worker structure
        run: node "$PROJECT_DIR/scripts/live-target-structure.mjs" "$LIVE_DIR"
      - name: Apply additive P1-A contracts
        run: node "$PROJECT_DIR/scripts/patch-p1a.mjs" "$LIVE_DIR"
      - name: Apply P1-A E2E continuation repair
        run: node "$PROJECT_DIR/scripts/patch-p1a-e2e-continuation.mjs" "$LIVE_DIR"
      - name: Apply owned Apply admission repair
        run: node "$PROJECT_DIR/scripts/patch-owned-apply-admission.mjs" "$LIVE_DIR"
      - name: Apply owned Apply queue reuse repair
        run: node "$PROJECT_DIR/scripts/patch-p1a-owned-apply-queue-reuse.mjs" "$LIVE_DIR"
      - name: Run owned Apply queue reuse regression
        run: node "$PROJECT_DIR/scripts/test-p1a-owned-apply-queue-reuse.mjs" "$PROJECT_DIR"
      - name: Apply score completion admission repair
        run: node "$PROJECT_DIR/scripts/patch-p1a-score-completion-admission.mjs" "$LIVE_DIR"
      - name: Apply P1-A runtime provider adapters
        run: node "$PROJECT_DIR/scripts/patch-p1a-runtime.mjs" "$LIVE_DIR"
      - name: Apply additive P1-B contracts
        run: node "$PROJECT_DIR/scripts/patch-p1b.mjs" "$LIVE_DIR"
      - name: Apply additive P1-C contracts
        run: node "$PROJECT_DIR/scripts/patch-p1c.mjs" "$LIVE_DIR"
      - name: Wire bounded vacancy verification worker
        run: node "$PROJECT_DIR/scripts/patch-p1a-vacancy-worker.mjs" "$LIVE_DIR"
      - name: Wire RetrievalProvider into JD worker
        run: node "$PROJECT_DIR/scripts/patch-p1a-jd-worker.mjs" "$LIVE_DIR"
      - name: Add deterministic queue admission quarantine
        run: node "$PROJECT_DIR/scripts/patch-recovery-admission.mjs" "$LIVE_DIR"
      - name: Add candidate claim wording guard
        run: node "$PROJECT_DIR/scripts/patch-candidate-claim-guard.mjs" "$LIVE_DIR"
      - name: Defer official PDF until candidate approval
        run: node "$PROJECT_DIR/scripts/patch-approval-before-pdf.mjs" "$LIVE_DIR"
      - name: Add connected release provenance writeback
        run: node "$PROJECT_DIR/scripts/patch-release-provenance.mjs" "$LIVE_DIR"
      - name: Add TRACE-GOLDEN-01 trace and same-fixture runner
        run: node "$PROJECT_DIR/scripts/patch-trace-golden-v0-runtime.mjs" "$LIVE_DIR"
      - name: Run owned Apply admission regression
        run: node "$PROJECT_DIR/scripts/test-owned-apply-admission.mjs" "$PROJECT_DIR"
      - name: Run score completion admission regression
        run: node "$PROJECT_DIR/scripts/test-p1a-score-completion-admission.mjs" "$PROJECT_DIR"
      - name: Apply official ATS JD retrieval routes
        run: node "$PROJECT_DIR/scripts/patch-p1a-jd-official-ats.mjs" "$LIVE_DIR"
      - name: Reject terminal queue replay
        run: node "$PROJECT_DIR/scripts/patch-queue-claim-status.mjs" "$LIVE_DIR"
      - name: Lock direct queue execution and flush durable state
        run: node "$PROJECT_DIR/scripts/patch-queue-run-lock.mjs" "$LIVE_DIR"
      - name: Serialize queue admission across entrypoints
        run: node "$PROJECT_DIR/scripts/patch-queue-admission-lock.mjs" "$LIVE_DIR"
      - name: Preserve completed worker outcome after elapsed-time warning
        run: node "$PROJECT_DIR/scripts/patch-post-worker-timeout.mjs" "$LIVE_DIR"
      - name: Hold interrupted queue work with unknown side effects
        run: node "$PROJECT_DIR/scripts/patch-stale-queue-hold.mjs" "$LIVE_DIR"
      - name: Hold worker errors with unknown side effects and honor retry due time
        run: node "$PROJECT_DIR/scripts/patch-queue-worker-uncertainty.mjs" "$LIVE_DIR"
      - name: Age eligible queue work to prevent application starvation
        run: node "$PROJECT_DIR/scripts/patch-queue-fairness.mjs" "$LIVE_DIR"
      - name: Prevent continuation from duplicating recovery-held work
        run: node "$PROJECT_DIR/scripts/patch-queue-hold-admission.mjs" "$LIVE_DIR"
      - name: Verify held work cannot be admitted twice
        run: node "$PROJECT_DIR/scripts/test-queue-hold-admission.mjs" "$LIVE_DIR"
      - name: Persist worker completion proof before queue success
        run: node "$PROJECT_DIR/scripts/patch-queue-completion-receipt.mjs" "$LIVE_DIR"
      - name: Witness disabled contact worker output by exact queue attempt
        run: node "$PROJECT_DIR/scripts/patch-queue-contact-witness.mjs" "$LIVE_DIR"
      - name: Witness company worker row, flag and cost by exact queue attempt
        run: node "$PROJECT_DIR/scripts/patch-queue-company-witness.mjs" "$LIVE_DIR"
      - name: Witness saved JD and score admission by exact queue attempt
        run: node "$PROJECT_DIR/scripts/patch-queue-jd-existing-witness.mjs" "$LIVE_DIR"
      - name: Witness newly retrieved JD and score admission by exact queue attempt
        run: node "$PROJECT_DIR/scripts/patch-queue-jd-recovered-witness.mjs" "$LIVE_DIR"
      - name: Witness closed vacancy and cancelled work by exact queue attempt
        run: node "$PROJECT_DIR/scripts/patch-queue-jd-closed-witness.mjs" "$LIVE_DIR"
      - name: Verify completion receipt and fail-closed hold reconciliation
        run: node "$PROJECT_DIR/scripts/test-queue-completion-receipt.mjs" "$LIVE_DIR"
      - name: Verify company worker witness and partial-write hold
        run: node "$PROJECT_DIR/scripts/test-queue-company-witness.mjs" "$LIVE_DIR"
      - name: Verify saved JD witness and unresolved JD paths
        run: node "$PROJECT_DIR/scripts/test-queue-jd-existing-witness.mjs" "$LIVE_DIR"
      - name: Verify newly retrieved JD witness and partial writes
        run: node "$PROJECT_DIR/scripts/test-queue-jd-recovered-witness.mjs" "$LIVE_DIR"
      - name: Verify closed-vacancy witness and partial writes
        run: node "$PROJECT_DIR/scripts/test-queue-jd-closed-witness.mjs" "$LIVE_DIR"
      - name: Run official ATS JD retrieval regression
        run: node "$PROJECT_DIR/scripts/test-p1a-jd-official-ats.mjs" "$PROJECT_DIR"
      - name: Stamp the candidate for independent runtime comparison
        run: node "$PROJECT_DIR/scripts/stamp-release-build.mjs" "$LIVE_DIR" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: JavaScript syntax validation
        shell: bash
        run: |
          find "$LIVE_DIR" -maxdepth 1 -type f \( -name '*.gs' -o -name '*.js' \) -print0 | sort -z | xargs -0 cat > /tmp/janu-job-copilot-combined.js
          test -s /tmp/janu-job-copilot-combined.js
          node --check /tmp/janu-job-copilot-combined.js
      - name: Preserve full P0 release contract
        shell: bash
        run: |
          set -o pipefail
          node "$PROJECT_DIR/scripts/validate-release.mjs" "$LIVE_DIR" | tee /tmp/janu-release-validation.json
      - name: Validate P1-A contracts, runtime adapters, vacancy and JD workers
        shell: bash
        run: |
          grep -q "P1-A-OWNED-APPLY-ADMISSION-1" /tmp/janu-job-copilot-combined.js
          grep -q "recoverySafe:true" /tmp/janu-job-copilot-combined.js
          for token in retrievalProviderRoute_ retrievalProvenance_ parseJobPostingJsonLd_ deterministicJobParse_ vacancyRevalidationRequired_ vacancyStateDecision_ sourcePromotionKey_ sourcePromotionDecision_ p1aContractSelfTest_ runP1AContractSelfTest p1a_self_test publicHttpUrl_ retrievalProviderConfig_ directOfficialFetch_ tavilySearch_ serpApiSearch_ retrievalGatewayFetch_ p1aRuntimeContractSelfTest_ p1aVacancyCandidate_ p1aVacancyFromRetrieval_ p1aWriteVacancyEvidence_ p1aVacancyMaintenanceTick_ p1aVacancyWorkerSelfTest_ runP1AVacancyWorkerSelfTest p1a_vacancy_self_test p1a_vacancy_last_result ashbyPublicPostingCoordinates_ ashbyPublicPostingFetch_ p1aJdTextFromRetrieval_ p1aJdRetrieveForApp_ p1aRecordJdRetrieval_ p1aJdRecoveryCandidate_ p1aJdRecoveryMaintenanceTick_ p1aJdWorkerSelfTest_ runP1AJdWorkerSelfTest p1a_jd_worker_self_test p1a_jd_recovery_last_result P1-A-JD-WORKER-1; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "P1-A contract/runtime/wiring missing: $token"; exit 9; }
          done
          grep -q "TAVILY_API_KEY" /tmp/janu-job-copilot-combined.js
          grep -q "SERPAPI_API_KEY" /tmp/janu-job-copilot-combined.js
          grep -q "allowPaid!==false" /tmp/janu-job-copilot-combined.js
          grep -q "p1aJdRetrieveForApp_(a,false)" /tmp/janu-job-copilot-combined.js
          grep -q "P1-A-SCORE-COMPLETION-ADMISSION-1" /tmp/janu-job-copilot-combined.js
          grep -q "P1-A-OWNED-APPLY-QUEUE-REUSE-1" /tmp/janu-job-copilot-combined.js
          grep -q "ownedFindQueueAdmission_" /tmp/janu-job-copilot-combined.js
      - name: Validate P1-B contracts
        shell: bash
        run: |
          for token in budgetDecision_ outputCacheKey_ outputCacheDecision_ companyCacheFresh_ dlqDecision_ gcQueueDecision_ p1bContractSelfTest_ runP1BContractSelfTest p1b_self_test; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "P1-B contract missing: $token"; exit 10; }
          done
      - name: Validate P1-C contracts
        shell: bash
        run: |
          for token in nextResumeRevision_ revisionDecision_ classifyJobOutcomeEmail_ outcomeMatchScore_ outcomeMatchDecision_ contactDiscoveryRoute_ contactCandidateDecision_ p1cContractSelfTest_ runP1CContractSelfTest p1c_self_test; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "P1-C contract missing: $token"; exit 11; }
          done
      - name: Validate release provenance contract
        shell: bash
        run: |
          for token in releaseProvenanceValidate_ releaseProvenanceContractSelfTest_ recordDeploymentProvenance runReleaseProvenanceContractSelfTest deployment_provenance_status deployment_git_commit deployment_source_sha256 REL-PROV-1; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "Release provenance contract missing: $token"; exit 13; }
          done
      - name: Validate TRACE-GOLDEN-01 contract
        shell: bash
        run: |
          for token in traceGoldenTick_ traceRefreshGolden_ traceGoldenCompleteness_ runTraceGoldenSelfTest TRACE-GOLDEN-V0-1 'Trace Explorer' golden_trace_status; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "TRACE-GOLDEN-01 contract missing: $token"; exit 14; }
          done
          grep -q "'Decision':'New'" /tmp/janu-job-copilot-combined.js
      - name: Build privacy-safe transformed-source manifest
        shell: bash
        run: |
          node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$LIVE_DIR" > /tmp/janu-deployment-manifest.json
          echo "EXPECTED_SOURCE_HASH=$(node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$LIVE_DIR" --hash-only)" >> "$GITHUB_ENV"
          cat /tmp/janu-deployment-manifest.json
      - name: Upload transformed-source manifest
        uses: actions/upload-artifact@v4
        with:
          name: janu-job-copilot-deployment-manifest-${{ github.sha }}
          path: /tmp/janu-deployment-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Push validated P1 source to Apps Script production project
        working-directory: .janu-live
        run: clasp push --force
      - name: Verify deployed source hash and rollback on mismatch
        shell: bash
        run: |
          set -euo pipefail
          pulled="$(mktemp -d)"
          cp "$LIVE_DIR/.clasp.json" "$pulled/.clasp.json"
          (cd "$pulled" && clasp pull)
          ACTUAL_SOURCE_HASH="$(node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$pulled" --hash-only)"
          if ! node "$PROJECT_DIR/scripts/check-source-snapshot.mjs" "$LIVE_DIR" "$pulled"; then
            echo 'Post-push source mismatch. Attempting the existing in-run rollback.'
            restore="$(mktemp -d)"
            cp "$LIVE_DIR/.clasp.json" "$restore/.clasp.json"
            cp -R "$JANU_PREIMAGE/." "$restore/"
            (cd "$restore" && clasp push --force)
            reread="$(mktemp -d)"
            cp "$LIVE_DIR/.clasp.json" "$reread/.clasp.json"
            (cd "$reread" && clasp pull)
            node "$PROJECT_DIR/scripts/check-source-snapshot.mjs" "$JANU_PREIMAGE" "$reread"
            echo 'Rollback readback matched. Candidate rejected.'
            exit 12
          fi
          test "$EXPECTED_SOURCE_HASH" = "$ACTUAL_SOURCE_HASH"
          echo "DEPLOYED_SOURCE_HASH=$ACTUAL_SOURCE_HASH" >> "$GITHUB_ENV"
          echo "Verified deployed source hash: $ACTUAL_SOURCE_HASH"
      - name: Promote canonical API executable and verify runtime identity
        working-directory: .janu-live
        shell: bash
        run: |
          set -euo pipefail
          pin="$GITHUB_WORKSPACE/$PROJECT_DIR/scripts/manage-canonical-pin.mjs"
          if node "$pin" promote "$JANU_PIN_STATE" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            && node "$pin" verify "$JANU_PIN_STATE" \
            && node "$GITHUB_WORKSPACE/$PROJECT_DIR/scripts/verify-runtime-release.mjs"; then
            exit 0
          fi
          echo 'Canonical pin promotion or runtime identity failed. Restoring pin and source.'
          set +e
          node "$pin" rollback "$JANU_PIN_STATE"
          pin_status=$?
          set -e
          cd "$GITHUB_WORKSPACE"
          restore="$(mktemp -d)"
          cp "$LIVE_DIR/.clasp.json" "$restore/.clasp.json"
          cp -R "$JANU_PREIMAGE/." "$restore/"
          set +e
          (cd "$restore" && clasp push --force)
          source_status=$?
          set -e
          reread="$(mktemp -d)"
          cp "$LIVE_DIR/.clasp.json" "$reread/.clasp.json"
          (cd "$reread" && clasp pull)
          set +e
          node "$PROJECT_DIR/scripts/check-source-snapshot.mjs" "$JANU_PREIMAGE" "$reread"
          readback_status=$?
          set -e
          if (( pin_status != 0 || source_status != 0 || readback_status != 0 )); then
            echo 'Rollback failed or readback mismatched. Manual recovery required.'
            exit 13
          fi
          echo 'Canonical pin and pre-push source restored and independently read back. Candidate rejected.'
          exit 12
      - name: Deployment summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          echo '## Janu Job Copilot P1 deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '- Base: live 1.3.8 / p0-regression-v19 only.' >> "$GITHUB_STEP_SUMMARY"
          echo "- Git commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Actions run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified transformed-source SHA-256: ${DEPLOYED_SOURCE_HASH:-not verified}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime acceptance job status: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo '- Privacy-safe source manifest uploaded; source text is not published as an artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo '- P1 contract telemetry is not treated as end-to-end feature completion.' >> "$GITHUB_STEP_SUMMARY"
          echo '- TRACE-GOLDEN-01 adds bounded same-fixture trace reconstruction and does not create an independent retrieval/provider path.' >> "$GITHUB_STEP_SUMMARY"
          echo '- P1-A includes runtime retrieval adapters, a bounded direct-official vacancy worker, and a RetrievalProvider-backed JD worker.' >> "$GITHUB_STEP_SUMMARY"
          echo '- JD recovery uses an official Ashby public posting adapter before generic page retrieval; paid search fallback remains disabled until P1-B runtime enforcement is complete.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Successful JD recovery requires canonical artifact/application readback and then queues the scoring stage.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Health-driven vacancy verification is limited to one stale active application per tick and cannot use paid provider fallback.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Stale official-Ashby JD blockers are retried at most one application per health tick; OpenAI parsing remains covered by existing budget/cost guards.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Applications vacancy/provenance columns are an explicit tracker schema migration.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing P0 release validator remains mandatory before push.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Documentation/governance changes are validated separately and do not trigger this production deploy workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No other ai-pm-portfolio project directories are read or modified.' >> "$GITHUB_STEP_SUMMARY"

  verify-existing-candidate:
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["main","janu-job-copilot/apps-script-ci","janu-job-copilot/p1a-release"]'), github.ref_name) && (inputs.verify_run != '' || inputs.verify_attempt != '' || inputs.verify_hash != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_DIR: startup-track/projects/2-janu-job-copilot
      EXPECTED_VERSION: '1.3.8'
      EXPECTED_SUITE: 'p0-regression-v19'
      ORIGINAL_RUN: ${{ inputs.verify_run }}
      ORIGINAL_ATTEMPT: ${{ inputs.verify_attempt }}
      ORIGINAL_PROJECT_HASH: ${{ inputs.verify_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original release identity inputs
        shell: bash
        run: |
          [[ "$ORIGINAL_RUN" =~ ^[1-9][0-9]*$ && "$ORIGINAL_ATTEMPT" =~ ^[1-9][0-9]*$ && "$ORIGINAL_PROJECT_HASH" =~ ^[a-f0-9]{64}$ ]]
      - name: Install release CLI
        run: npm install --global @google/clasp@3.4.1
      - name: Verify original build without pushing source
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d)"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$scratch/.clasp.json"
          cd "$scratch"
          clasp pull
          manifest="$GITHUB_WORKSPACE/$PROJECT_DIR/scripts/deployment-manifest.mjs"
          actual="$(node "$manifest" "$scratch" --full-project-hash)"
          test "$actual" = "$ORIGINAL_PROJECT_HASH"
          DEPLOYED_SOURCE_HASH="$(node "$manifest" "$scratch" --hash-only)"
          export DEPLOYED_SOURCE_HASH
          GITHUB_RUN_ID="$ORIGINAL_RUN" GITHUB_RUN_ATTEMPT="$ORIGINAL_ATTEMPT" node "$GITHUB_WORKSPACE/$PROJECT_DIR/scripts/verify-runtime-release.mjs"
