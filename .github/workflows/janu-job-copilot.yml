name: Janu Job Copilot Apps Script CD

on:
  push:
    branches:
      - main
      - janu-job-copilot/apps-script-ci
      - janu-job-copilot/p1a-release
    paths:
      - 'startup-track/projects/2-janu-job-copilot/scripts/**'
      - '.github/workflows/janu-job-copilot.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - 'startup-track/projects/2-janu-job-copilot/scripts/**'
      - '.github/workflows/janu-job-copilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janu-job-copilot-apps-script-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.head_ref == 'janu-job-copilot/apps-script-ci' || github.head_ref == 'janu-job-copilot/p1a-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_VERSION: '1.3.8'
      EXPECTED_SUITE: 'p0-regression-v19'
      PROJECT_DIR: startup-track/projects/2-janu-job-copilot
      LIVE_DIR: .janu-live
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - name: Checkout isolated Job Copilot branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch machinery syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=("$PROJECT_DIR"/scripts/*.mjs)
          test ${#files[@]} -gt 0 || { echo 'No Job Copilot patch/validation scripts found'; exit 2; }
          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Verify deployment credentials exist
        shell: bash
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing JANU_CLASPRC_JSON'; exit 2; }
          test -n "$CLASP_JSON" || { echo 'Missing JANU_CLASP_JSON'; exit 2; }
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Prepare ephemeral Apps Script workspace
        shell: bash
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Confirm CI clasp identity
        shell: bash
        run: |
          set -o pipefail
          out="$(clasp show-authorized-user --user "$CLASP_USER" 2>&1)"
          printf '%s\n' "$out"
          if grep -Eiq 'Not logged in|No credentials found' <<<"$out" || ! grep -q 'You are logged in as ' <<<"$out"; then
            echo 'CI clasp named profile is not semantically authenticated.' >&2
            exit 16
          fi
      - name: Pull current production Apps Script
        working-directory: .janu-live
        run: clasp pull --user "$CLASP_USER"
      - name: Snapshot pre-deploy source for in-run rollback
        shell: bash
        run: |
          rm -rf /tmp/janu-predeploy
          mkdir -p /tmp/janu-predeploy
          find "$LIVE_DIR" -maxdepth 1 -type f \( -name '*.gs' -o -name '*.js' -o -name 'appsscript.json' \) -exec cp {} /tmp/janu-predeploy/ \;
          test -n "$(find /tmp/janu-predeploy -maxdepth 1 -type f -print -quit)" || { echo 'Pre-deploy source backup is empty'; exit 2; }
      - name: Assert accepted P0 baseline
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('.janu-live/TrackerWorkflow.js','utf8');
          const p=s.match(/P12\s*=\s*Object\.freeze\(\{[\s\S]*?VERSION\s*:\s*['"]([^'"]+)['"][\s\S]*?SUITE\s*:\s*['"]([^'"]+)['"]/);
          if(!p) throw new Error('Unable to read live P12 release identity');
          const version=p[1],suite=p[2];
          if(version!=='1.3.8'||suite!=='p0-regression-v19') throw new Error(`P1 blocked: expected live 1.3.8 / p0-regression-v19, found ${version} / ${suite}`);
          console.log(JSON.stringify({baseline:'PASS',version,suite}));
          NODE
      - name: Inspect safe live integration manifest
        run: node "$PROJECT_DIR/scripts/live-source-manifest.mjs" "$LIVE_DIR"
      - name: Inspect safe target worker structure
        run: node "$PROJECT_DIR/scripts/live-target-structure.mjs" "$LIVE_DIR"
      - name: Apply additive P1-A contracts
        run: node "$PROJECT_DIR/scripts/patch-p1a.mjs" "$LIVE_DIR"
      - name: Apply P1-A runtime provider adapters
        run: node "$PROJECT_DIR/scripts/patch-p1a-runtime.mjs" "$LIVE_DIR"
      - name: Apply additive P1-B contracts
        run: node "$PROJECT_DIR/scripts/patch-p1b.mjs" "$LIVE_DIR"
      - name: Apply additive P1-C contracts
        run: node "$PROJECT_DIR/scripts/patch-p1c.mjs" "$LIVE_DIR"
      - name: Wire bounded vacancy verification worker
        run: node "$PROJECT_DIR/scripts/patch-p1a-vacancy-worker.mjs" "$LIVE_DIR"
      - name: Wire RetrievalProvider into JD worker
        run: node "$PROJECT_DIR/scripts/patch-p1a-jd-worker.mjs" "$LIVE_DIR"
      - name: Add connected release provenance writeback
        run: node "$PROJECT_DIR/scripts/patch-release-provenance.mjs" "$LIVE_DIR"
      - name: Add TRACE-GOLDEN, continuation, renderer quarantine and trace durability
        run: node "$PROJECT_DIR/scripts/patch-trace-golden-v0-runtime.mjs" "$LIVE_DIR"
      - name: JavaScript syntax validation
        shell: bash
        run: |
          find "$LIVE_DIR" -maxdepth 1 -type f \( -name '*.gs' -o -name '*.js' \) -print0 | sort -z | xargs -0 cat > /tmp/janu-job-copilot-combined.js
          test -s /tmp/janu-job-copilot-combined.js
          node --check /tmp/janu-job-copilot-combined.js
      - name: Preserve full P0 release contract
        shell: bash
        run: |
          set -o pipefail
          node "$PROJECT_DIR/scripts/validate-release.mjs" "$LIVE_DIR" | tee /tmp/janu-release-validation.json
      - name: Validate P1-A contracts, runtime adapters, vacancy and JD workers
        shell: bash
        run: |
          for token in retrievalProviderRoute_ retrievalProvenance_ parseJobPostingJsonLd_ deterministicJobParse_ vacancyRevalidationRequired_ vacancyStateDecision_ sourcePromotionKey_ sourcePromotionDecision_ p1aContractSelfTest_ runP1AContractSelfTest p1a_self_test publicHttpUrl_ retrievalProviderConfig_ directOfficialFetch_ tavilySearch_ serpApiSearch_ retrievalGatewayFetch_ p1aRuntimeContractSelfTest_ p1aVacancyCandidate_ p1aVacancyFromRetrieval_ p1aWriteVacancyEvidence_ p1aVacancyMaintenanceTick_ p1aVacancyWorkerSelfTest_ runP1AVacancyWorkerSelfTest p1a_vacancy_self_test p1a_vacancy_last_result ashbyPublicPostingCoordinates_ ashbyPublicPostingFetch_ p1aJdTextFromRetrieval_ p1aJdRetrieveForApp_ p1aRecordJdRetrieval_ p1aJdRecoveryCandidate_ p1aJdRecoveryMaintenanceTick_ p1aJdWorkerSelfTest_ runP1AJdWorkerSelfTest p1a_jd_worker_self_test p1a_jd_recovery_last_result P1-A-JD-WORKER-1; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "P1-A contract/runtime/wiring missing: $token"; exit 9; }
          done
          grep -q "TAVILY_API_KEY" /tmp/janu-job-copilot-combined.js
          grep -q "SERPAPI_API_KEY" /tmp/janu-job-copilot-combined.js
          grep -q "allowPaid!==false" /tmp/janu-job-copilot-combined.js
          grep -q "p1aJdRetrieveForApp_(a,false)" /tmp/janu-job-copilot-combined.js
      - name: Validate P1-B contracts
        shell: bash
        run: |
          for token in budgetDecision_ outputCacheKey_ outputCacheDecision_ companyCacheFresh_ dlqDecision_ gcQueueDecision_ p1bContractSelfTest_ runP1BContractSelfTest p1b_self_test; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "P1-B contract missing: $token"; exit 10; }
          done
      - name: Validate P1-C contracts
        shell: bash
        run: |
          for token in nextResumeRevision_ revisionDecision_ classifyJobOutcomeEmail_ outcomeMatchScore_ outcomeMatchDecision_ contactDiscoveryRoute_ contactCandidateDecision_ p1cContractSelfTest_ runP1CContractSelfTest p1c_self_test; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "P1-C contract missing: $token"; exit 11; }
          done
      - name: Validate release provenance contract
        shell: bash
        run: |
          for token in releaseProvenanceValidate_ releaseProvenanceContractSelfTest_ recordDeploymentProvenance runReleaseProvenanceContractSelfTest deployment_provenance_status deployment_git_commit deployment_source_sha256 REL-PROV-1; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "Release provenance contract missing: $token"; exit 13; }
          done
      - name: Validate active TRACE, continuation, renderer, durability and runtime safety contracts
        shell: bash
        run: |
          for token in traceGoldenTick_ traceRefreshGolden_ traceGoldenCompleteness_ runTraceGoldenSelfTest TRACE-GOLDEN-V0-2 P1-A-E2E-CONTINUATION-3 RENDER-CAREERBREAK-V2 RENDER-CAREERBREAK-001 PREVENTION-RECURRENCE-001 rendererQuarantineBlocks_ ATOMIC_APPEND_VERIFY_RETIRE golden_trace_lock_reset 'Trace Explorer' golden_trace_status QUEUE-NOJOB-QUARANTINE-001 HEALTH-RUNTIME-RESERVE-001 REGRESSION-HEALTH-FINAL-LOCK-001; do
            grep -q "$token" /tmp/janu-job-copilot-combined.js || { echo "Active release/runtime contract missing: $token"; exit 14; }
          done
          grep -q "'Decision':'New'" /tmp/janu-job-copilot-combined.js
      - name: Build privacy-safe transformed-source manifest
        shell: bash
        run: |
          node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$LIVE_DIR" > /tmp/janu-deployment-manifest.json
          echo "EXPECTED_SOURCE_HASH=$(node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$LIVE_DIR" --hash-only)" >> "$GITHUB_ENV"
          cat /tmp/janu-deployment-manifest.json
      - name: Upload transformed-source manifest
        uses: actions/upload-artifact@v4
        with:
          name: janu-job-copilot-deployment-manifest-${{ github.sha }}
          path: /tmp/janu-deployment-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Push validated P1 source to Apps Script production project
        working-directory: .janu-live
        run: clasp push --force --user "$CLASP_USER"
      - name: Verify deployed source hash and rollback on mismatch
        shell: bash
        run: |
          (cd "$LIVE_DIR" && clasp pull --user "$CLASP_USER")
          ACTUAL_SOURCE_HASH="$(node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$LIVE_DIR" --hash-only)"
          if [ "$ACTUAL_SOURCE_HASH" != "$EXPECTED_SOURCE_HASH" ]; then
            echo "Deployed source hash mismatch: expected $EXPECTED_SOURCE_HASH, got $ACTUAL_SOURCE_HASH"
            find "$LIVE_DIR" -maxdepth 1 -type f \( -name '*.gs' -o -name '*.js' -o -name 'appsscript.json' \) -delete
            cp /tmp/janu-predeploy/* "$LIVE_DIR"/
            (cd "$LIVE_DIR" && clasp push --force --user "$CLASP_USER")
            echo 'Pre-deploy source restored after hash mismatch.'
            exit 12
          fi
          echo "DEPLOYED_SOURCE_HASH=$ACTUAL_SOURCE_HASH" >> "$GITHUB_ENV"
          echo "Verified deployed source hash: $ACTUAL_SOURCE_HASH"
      - name: Persist and verify connected deployment provenance
        working-directory: .janu-live
        shell: bash
        run: |
          run_clasp_checked() {
            local out rc
            set +e
            out="$(clasp run "$@" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ] || grep -Eiq 'Unable to run script function|Script function not found|permission to run the script function|API executable|Execution API|Exception:|^Error:|Error 502|Server Error' <<<"$out"; then
              echo "Semantic clasp execution failure for: $*" >&2
              return 15
            fi
          }
          run_clasp_checked runReleaseProvenanceContractSelfTest --user "$CLASP_USER"
          PARAMS="$(node -e 'console.log(JSON.stringify([process.env.GITHUB_SHA,process.env.GITHUB_RUN_ID,process.env.GITHUB_RUN_ATTEMPT,process.env.DEPLOYED_SOURCE_HASH,process.env.EXPECTED_VERSION,process.env.EXPECTED_SUITE]))')"
          echo 'Persisting privacy-safe deployment provenance to connected product state.'
          run_clasp_checked recordDeploymentProvenance --params "$PARAMS" --user "$CLASP_USER"
      - name: Attempt P1-A self-test immediately
        continue-on-error: true
        working-directory: .janu-live
        shell: bash
        run: |
          out="$(clasp run runP1AContractSelfTest --nondev --user "$CLASP_USER" 2>&1)"; rc=$?; printf '%s\n' "$out"; test "$rc" -eq 0; ! grep -Eiq 'Unable to run script function|Script function not found|permission to run the script function|API executable|Execution API|Exception:|^Error:|Error 502|Server Error' <<<"$out"
      - name: Attempt P1-B self-test immediately
        continue-on-error: true
        working-directory: .janu-live
        shell: bash
        run: |
          out="$(clasp run runP1BContractSelfTest --nondev --user "$CLASP_USER" 2>&1)"; rc=$?; printf '%s\n' "$out"; test "$rc" -eq 0; ! grep -Eiq 'Unable to run script function|Script function not found|permission to run the script function|API executable|Execution API|Exception:|^Error:|Error 502|Server Error' <<<"$out"
      - name: Attempt P1-C self-test immediately
        continue-on-error: true
        working-directory: .janu-live
        shell: bash
        run: |
          out="$(clasp run runP1CContractSelfTest --nondev --user "$CLASP_USER" 2>&1)"; rc=$?; printf '%s\n' "$out"; test "$rc" -eq 0; ! grep -Eiq 'Unable to run script function|Script function not found|permission to run the script function|API executable|Execution API|Exception:|^Error:|Error 502|Server Error' <<<"$out"
      - name: Require bounded health/control tick
        working-directory: .janu-live
        shell: bash
        run: |
          started="$(date +%s)"
          out="$(clasp run phase1HealthTick --nondev --user "$CLASP_USER" 2>&1)"; rc=$?
          elapsed="$(( $(date +%s) - started ))"
          printf '%s\n' "$out"
          echo "Health tick elapsed seconds: $elapsed"
          test "$rc" -eq 0
          ! grep -Eiq 'Unable to run script function|Script function not found|permission to run the script function|API executable|Execution API|Exception:|^Error:|Error 502|Server Error' <<<"$out"
          test "$elapsed" -lt 240 || { echo "Health tick exceeded runtime budget: ${elapsed}s"; exit 17; }
      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo '## Janu Job Copilot P1 deployment' >> "$GITHUB_STEP_SUMMARY"
          echo '- Base: live 1.3.8 / p0-regression-v19 only.' >> "$GITHUB_STEP_SUMMARY"
          echo "- Git commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Actions run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verified transformed-source SHA-256: ${DEPLOYED_SOURCE_HASH:-not verified}" >> "$GITHUB_STEP_SUMMARY"
          echo '- clasp identity and runtime calls are semantically checked; known auth/API/execution/502 error text is a failed gate even when clasp exits zero.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Bounded health execution is a required release gate; a green job cannot mask runtime liveness failure.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Verified deployment identity is persisted to connected Job Copilot Worker State only after post-push source-hash verification and successful semantic execution.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Privacy-safe source manifest uploaded; source text is not published as an artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo '- P1 contract telemetry is not treated as end-to-end feature completion.' >> "$GITHUB_STEP_SUMMARY"
          echo '- TRACE-GOLDEN-01 adds bounded same-fixture trace reconstruction and does not create an independent retrieval/provider path.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing P0 release validator remains mandatory before push.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Documentation/governance changes are validated separately and do not trigger this production deploy workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No other ai-pm-portfolio project directories are read or modified.' >> "$GITHUB_STEP_SUMMARY"