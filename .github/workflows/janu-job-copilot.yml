name: Janu Job Copilot P1 Integration

on:
  push:
    branches: [janu-job-copilot/p1-integration]
    paths:
      - 'startup-track/projects/2-janu-job-copilot/**'
      - '.github/workflows/janu-job-copilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janu-job-copilot-apps-script-production
  cancel-in-progress: false

jobs:
  deploy-p1a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_DIR: startup-track/projects/2-janu-job-copilot
      LIVE_DIR: .janu-live
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credentials
        run: |
          test -n "$CLASPRC_JSON" || exit 2
          test -n "$CLASP_JSON" || exit 2
      - run: npm install --global @google/clasp
      - name: Prepare ephemeral Apps Script workspace
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Confirm identity
        run: clasp show-authorized-user --user "$CLASP_USER"
      - name: Pull live production source
        working-directory: .janu-live
        run: clasp pull --user "$CLASP_USER"
      - name: Assert P0 baseline is not stale
        run: |
          node - <<'NODE'
          const fs=require('fs'); const p='.janu-live/TrackerWorkflow.js'; const s=fs.readFileSync(p,'utf8');
          const vm=s.match(/VERSION\s*:\s*['"](\d+)\.(\d+)\.(\d+)['"]/); const sm=s.match(/SUITE\s*:\s*['"]p0-regression-v(\d+)['"]/);
          if(!vm||!sm) throw new Error('Cannot determine live P0 release identity');
          const version=vm.slice(1).map(Number), suite=Number(sm[1]);
          const min=[1,3,8]; const ok=version[0]>min[0]||version[0]===min[0]&&(version[1]>min[1]||version[1]===min[1]&&version[2]>=min[2]);
          if(!ok||suite<19) throw new Error(`P1 blocked: live baseline ${vm[1]}.${vm[2]}.${vm[3]} / v${suite} is older than accepted P0 1.3.8 / v19`);
          console.log(JSON.stringify({baseline:'PASS',version:`${vm[1]}.${vm[2]}.${vm[3]}`,suite:`p0-regression-v${suite}`}));
          NODE
      - name: Apply additive P1-A contracts
        run: node "$PROJECT_DIR/scripts/patch-p1a.mjs" "$LIVE_DIR"
      - name: Syntax and P1-A contract validation
        run: |
          find "$LIVE_DIR" -maxdepth 1 -type f \( -name '*.gs' -o -name '*.js' \) -print0 | sort -z | xargs -0 cat > /tmp/janu-combined.js
          node --check /tmp/janu-combined.js
          for token in retrievalProviderRoute_ retrievalProvenance_ parseJobPostingJsonLd_ deterministicJobParse_ vacancyRevalidationRequired_ sourcePromotionDecision_ p1aContractSelfTest_; do grep -q "$token" /tmp/janu-combined.js || exit 3; done
      - name: Push validated P1-A source
        working-directory: .janu-live
        run: clasp push --force --user "$CLASP_USER"
      - name: Trigger bounded health/control tick
        continue-on-error: true
        working-directory: .janu-live
        run: clasp run phase1HealthTick --nondev --user "$CLASP_USER"
      - name: Summary
        if: always()
        run: |
          echo '## Janu Job Copilot P1-A' >> "$GITHUB_STEP_SUMMARY"
          echo '- Deployment is additive over live P0; no P0 release patcher is invoked.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live baseline must be >= 1.3.8 / p0-regression-v19.' >> "$GITHUB_STEP_SUMMARY"
          echo '- P1-A adds retrieval routing, provenance, deterministic parsing, vacancy freshness and promotion idempotency contracts.' >> "$GITHUB_STEP_SUMMARY"
