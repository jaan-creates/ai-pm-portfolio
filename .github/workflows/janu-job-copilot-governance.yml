name: Janu Job Copilot Governance

on:
  push:
    branches:
      - main
    paths:
      - 'startup-track/projects/2-janu-job-copilot/**'
      - '.github/workflows/janu-job-copilot-governance.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'startup-track/projects/2-janu-job-copilot/**'
      - '.github/workflows/janu-job-copilot-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-product-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_DIR: startup-track/projects/2-janu-job-copilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Job Copilot patch and governance script syntax
        shell: bash
        run: |
          shopt -s nullglob
          files=("$PROJECT_DIR"/scripts/*.mjs)
          test ${#files[@]} -gt 0 || { echo 'No Job Copilot scripts found'; exit 2; }
          for f in "${files[@]}"; do
            node --check "$f"
          done

      - name: Validate AI Systems Lab product baseline
        run: node "$PROJECT_DIR/scripts/validate-ai-systems-baseline.mjs" "$PROJECT_DIR"

      - name: Validate public governance-document privacy
        run: node "$PROJECT_DIR/scripts/validate-public-doc-privacy.mjs" "$PROJECT_DIR"

      - name: Behavior-test privacy guard
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          printf '# Product\nPrivate contact: person@example.com\n' > "$tmp/PRODUCT.md"
          if node "$PROJECT_DIR/scripts/validate-public-doc-privacy.mjs" "$tmp" >/tmp/privacy-negative.out 2>&1; then
            echo 'Privacy guard failed to reject a known email fixture'
            cat /tmp/privacy-negative.out
            exit 20
          fi
          grep -q 'PUBLIC-DOC-PRIVACY-1' /tmp/privacy-negative.out

      - name: Behavior-test deployment manifest
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          printf 'function alpha(){return 1;}\n' > "$tmp/A.js"
          printf 'function beta(){return 2;}\n' > "$tmp/B.gs"
          if node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$tmp" >/dev/null 2>&1; then
            echo 'Incomplete project accepted without appsscript.json'
            exit 20
          fi
          printf '{}' > "$tmp/appsscript.json"
          h1="$(node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$tmp" --hash-only)"
          whole="$(node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$tmp" --full-project-hash)"
          node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$tmp" > /tmp/deployment-manifest-test.json
          grep -q "$whole" /tmp/deployment-manifest-test.json
          printf '<p>fixture</p>' > "$tmp/View.html"
          test "$whole" != "$(node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$tmp" --full-project-hash)"
          grep -q 'JANU-DEPLOYMENT-MANIFEST-1' /tmp/deployment-manifest-test.json
          grep -q "$h1" /tmp/deployment-manifest-test.json
          if grep -q 'function alpha' /tmp/deployment-manifest-test.json; then
            echo 'Deployment manifest leaked source text'
            exit 21
          fi
          printf 'function beta(){return 3;}\n' > "$tmp/B.gs"
          h2="$(node "$PROJECT_DIR/scripts/deployment-manifest.mjs" "$tmp" --hash-only)"
          test "$h1" != "$h2" || { echo 'Deployment hash did not change with source change'; exit 22; }

      - name: Behavior-test release provenance patch
        run: node "$PROJECT_DIR/scripts/test-release-provenance-patch.mjs" "$PROJECT_DIR"

      - name: Guard vacancy lifecycle partial-install convergence
        run: node "$PROJECT_DIR/scripts/test-vacancy-lifecycle-convergence.mjs" "$PROJECT_DIR"

      - name: Behavior-test TRACE-GOLDEN-01 patch
        run: node "$PROJECT_DIR/scripts/test-trace-golden-v0-patch.mjs" "$PROJECT_DIR"
      - name: Behavior-test Eltropy continuation admission
        run: node "$PROJECT_DIR/scripts/test-eltropy-continuation-admission.mjs" "$PROJECT_DIR"

      - name: Behavior-test Apply-to-resume timing write-back
        run: node "$PROJECT_DIR/scripts/test-apply-resume-timing.mjs" "$PROJECT_DIR"

      - name: Behavior-test fair continuation cursor
        run: node "$PROJECT_DIR/scripts/test-continuation-cursor-fairness.mjs" "$PROJECT_DIR"

      - name: Behavior-test downstream shim contract compatibility
        run: node "$PROJECT_DIR/scripts/test-e2e-shim-contract-compatibility.mjs" "$PROJECT_DIR"

      - name: Behavior-test release validator health-hook contract
        run: node "$PROJECT_DIR/scripts/test-release-validator-health-hook.mjs" "$PROJECT_DIR"
      - name: Run evidence contract negative controls
        run: node "$PROJECT_DIR/assurance/test-contract.mjs"
      - name: Check approval-before-PDF contract
        run: node "$PROJECT_DIR/assurance/test-approval-pdf-contract.mjs"
      - name: Check renderer integrity contract
        run: node "$PROJECT_DIR/assurance/test-renderer-contract.mjs"
      - name: Check telemetry propagation contract
        run: node "$PROJECT_DIR/assurance/test-telemetry-propagation.mjs"
      - name: Check escaped regression controls
        run: node "$PROJECT_DIR/assurance/test-escaped-regressions.mjs"
      - name: Check recurring sourcing task continuity
        run: node "$PROJECT_DIR/assurance/test-sourcing-task-continuity.mjs"
      - name: Check offline evaluation cases
        run: node "$PROJECT_DIR/evals/run.mjs"
      - name: Verify release execution and readback failures
        run: node "$PROJECT_DIR/scripts/test-runtime-release.mjs"
      - name: Verify canonical API pin promotion and rollback
        run: node "$PROJECT_DIR/scripts/test-canonical-pin.mjs"
      - name: Verify evaluation coverage mapping
        run: node "$PROJECT_DIR/assurance/test-eval-coverage.mjs"
      - name: Set up PDF extraction for isolated acceptance fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install pdfplumber==0.11.9
      - name: Check assembled JD persistence and score admission
        run: node "$PROJECT_DIR/scripts/test-jd-worker-readback.mjs"
      - name: Check repeated queue admission
        run: node "$PROJECT_DIR/scripts/test-recovery-admission.mjs"
      - name: Check candidate claim support
        run: node "$PROJECT_DIR/scripts/test-candidate-claim-guard.mjs"
      - name: Check approval before official PDF publication
        run: node "$PROJECT_DIR/scripts/test-approval-before-pdf-patch.mjs"
      - name: Check terminal queue replay guard
        run: node "$PROJECT_DIR/scripts/test-queue-claim-status.mjs"
      - name: Check direct queue lock and flush
        run: node "$PROJECT_DIR/scripts/test-queue-run-lock.mjs"
      - name: Check serialized queue admission
        run: node "$PROJECT_DIR/scripts/test-queue-admission-lock.mjs"
      - name: Check completed worker outcome after timeout warning
        run: node "$PROJECT_DIR/scripts/test-post-worker-timeout.mjs"
      - name: Check interrupted queue outcome hold
        run: node "$PROJECT_DIR/scripts/test-stale-queue-hold.mjs"
      - name: Check uncertain worker error hold and retry due time
        run: node "$PROJECT_DIR/scripts/test-queue-worker-uncertainty.mjs"
      - name: Check fair queue continuation across applications
        run: node "$PROJECT_DIR/scripts/test-queue-fairness.mjs"
      - name: Check version-bound review actions
        run: node "$PROJECT_DIR/scripts/test-resume-review-action.mjs"
      - name: Check approved PDF bytes and extracted text
        run: node "$PROJECT_DIR/assurance/test-submission-asset.mjs"
      - name: Check cross-release traces and duplicate slots
        run: node "$PROJECT_DIR/assurance/test-trace-release.mjs"
      - name: Check restored source against private preimage
        run: node "$PROJECT_DIR/scripts/test-rollback-readback.mjs"
      - name: Check trace isolation and lock ownership
        run: node "$PROJECT_DIR/scripts/test-trace-projection.mjs"
      - name: Check Career Break rendering through the patched entry point
        run: node "$PROJECT_DIR/assurance/test-rendered-career-break.mjs"
      - name: Check isolated vacancy to verified PDF journey
        run: node "$PROJECT_DIR/assurance/test-recovery-journey.mjs"
      - name: Read the persisted receipt after full and partial writes
        run: node "$PROJECT_DIR/scripts/test-persisted-release-receipt.mjs"
      - name: Preserve offline evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: janu-offline-evals-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.PROJECT_DIR }}/evals/report.json
          if-no-files-found: error
          retention-days: 14
