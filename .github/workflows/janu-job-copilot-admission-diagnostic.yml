name: Janu Job Copilot Admission Diagnostic

on:
  push:
    branches:
      - janu-job-copilot/apps-script-ci
    paths:
      - '.github/workflows/janu-job-copilot-admission-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_DIR: .janu-admission-diagnostic
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credentials
        shell: bash
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Prepare read-only workspace
        shell: bash
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Pull connected production source
        working-directory: .janu-admission-diagnostic
        run: clasp pull --user "$CLASP_USER"
      - name: Emit bounded canary and sourcing control paths
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='.janu-admission-diagnostic';
          const source=fs.readdirSync(dir).filter(f=>/\.(?:js|gs)$/.test(f)).map(f=>fs.readFileSync(path.join(dir,f),'utf8')).join('\n');
          function extract(name){
            const start=source.indexOf('function '+name+'('); if(start<0)return 'NOT_FOUND';
            const open=source.indexOf('{',start); let depth=0,quote=null,esc=false,line=false,block=false;
            for(let i=open;i<source.length;i++){
              const c=source[i],n=source[i+1]||'';
              if(line){if(c==='\n')line=false;continue;}
              if(block){if(c==='*'&&n==='/'){block=false;i++;}continue;}
              if(quote){if(esc){esc=false;continue;}if(c==='\\'){esc=true;continue;}if(c===quote)quote=null;continue;}
              if(c==='/'&&n==='/'){line=true;i++;continue;}
              if(c==='/'&&n==='*'){block=true;i++;continue;}
              if(c==='"'||c==="'"||c==='`'){quote=c;continue;}
              if(c==='{')depth++; else if(c==='}'&&--depth===0)return source.slice(start,i+1);
            }
            return 'UNTERMINATED';
          }
          const names=[...source.matchAll(/function\s+([A-Za-z0-9_$]+)\s*\(/g)].map(m=>m[1]);
          const selected=['installOwnedRendererCanaryTrigger','runOwnedRendererCanaryTick','rendererFreshCanaryEnqueue_','rendererExactCanaryExecute_','ownedApplyAdmission_','ownedApplyStatePlan_','ownedEnsureQueueAdmission_'];
          for(const name of selected) console.log('\n=== '+name+' ===\n'+extract(name));
          const needles=['SOURCE-CONTROL-001','SOURCE-CYCLE-DEDUPE-001','last_sourcing_success_at','__Sourcing Runs','SOURCING_STALE','sourcing_','Sourcing'];
          const hits=[];
          for(const name of names){const body=extract(name);if(needles.some(n=>body.includes(n)))hits.push(name);}
          console.log('\n=== SOURCING FUNCTION NAMES ===\n'+[...new Set(hits)].sort().join('\n'));
          for(const name of [...new Set(hits)].sort()) console.log('\n=== '+name+' ===\n'+extract(name));
          for(const needle of ['SOURCE-CONTROL-001','SOURCE-CYCLE-DEDUPE-001','last_sourcing_success_at','__Sourcing Runs','SOURCING_STALE']){
            console.log('\n=== CONTEXT '+needle+' ===');
            let from=0,count=0;
            while(count<8){const i=source.indexOf(needle,from);if(i<0)break;console.log(source.slice(Math.max(0,i-500),Math.min(source.length,i+900)));from=i+needle.length;count++;}
          }
          NODE
