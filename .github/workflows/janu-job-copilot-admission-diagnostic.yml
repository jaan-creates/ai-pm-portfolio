name: Janu Job Copilot Admission Diagnostic

on:
  push:
    branches:
      - janu-job-copilot/apps-script-ci
    paths:
      - '.github/workflows/janu-job-copilot-admission-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_DIR: .janu-admission-diagnostic
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credentials
        run: |
          test -n "$CLASPRC_JSON"
          test -n "$CLASP_JSON"
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Prepare read-only workspace
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Pull connected production source
        working-directory: .janu-admission-diagnostic
        run: clasp pull --user "$CLASP_USER"
      - name: Emit exact canary gate and sourcing health paths
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='.janu-admission-diagnostic';
          const source=fs.readdirSync(dir).filter(f=>/\.(?:js|gs)$/.test(f)).map(f=>fs.readFileSync(path.join(dir,f),'utf8')).join('\n');
          function extract(name){const start=source.indexOf('function '+name+'(');if(start<0)return 'NOT_FOUND';const open=source.indexOf('{',start);let depth=0,q=null,e=false,line=false,block=false;for(let i=open;i<source.length;i++){const c=source[i],n=source[i+1]||'';if(line){if(c==='\n')line=false;continue;}if(block){if(c==='*'&&n==='/'){block=false;i++;}continue;}if(q){if(e){e=false;continue;}if(c==='\\'){e=true;continue;}if(c===q)q=null;continue;}if(c==='/'&&n==='/'){line=true;i++;continue;}if(c==='/'&&n==='*'){block=true;i++;continue;}if(c==='"'||c==="'"||c==='`'){q=c;continue;}if(c==='{')depth++;else if(c==='}'&&--depth===0)return source.slice(start,i+1);}return 'UNTERMINATED';}
          for(const name of ['installOwnedRendererCanaryTrigger','runOwnedRendererCanaryTick','controlPlaneExecutionAuthorized_','rendererCanaryPreconditionsMet_','rendererPreventionReady_','rendererQuarantineBlocks_','workNeeded_','workNeededFromState_','sourceFreshnessHealth_'])console.log('\n=== '+name+' ===\n'+extract(name));
          NODE
