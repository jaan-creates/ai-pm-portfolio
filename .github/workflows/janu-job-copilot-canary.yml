name: Janu Job Copilot Authorized Canary

on:
  push:
    branches:
      - janu-job-copilot/apps-script-ci
    paths:
      - '.github/janu-job-copilot-canary-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janu-job-copilot-authorized-canary
  cancel-in-progress: false

jobs:
  run-one-authorized-job:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LIVE_DIR: .janu-live
      CLASPRC_JSON: ${{ secrets.JANU_CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.JANU_CLASP_JSON }}
      CLASP_USER: janu-build
    steps:
      - name: Checkout isolated Job Copilot branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment credentials exist
        shell: bash
        run: |
          test -n "$CLASPRC_JSON" || { echo 'Missing JANU_CLASPRC_JSON'; exit 2; }
          test -n "$CLASP_JSON" || { echo 'Missing JANU_CLASP_JSON'; exit 2; }
      - name: Install clasp
        run: npm install --global @google/clasp
      - name: Prepare Apps Script execution workspace
        shell: bash
        run: |
          mkdir -p "$LIVE_DIR"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > "$LIVE_DIR/.clasp.json"
          chmod 600 "$LIVE_DIR/.clasp.json"
      - name: Confirm CI clasp identity
        shell: bash
        run: |
          set -o pipefail
          out="$(clasp show-authorized-user --user "$CLASP_USER" 2>&1)"
          printf '%s\n' "$out"
          grep -q 'You are logged in as ' <<<"$out"
      - name: Pull exact connected production source
        working-directory: .janu-live
        run: clasp pull --user "$CLASP_USER"
      - name: Diagnose worker circuit source
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const dir='.janu-live';
          const source=fs.readdirSync(dir).filter(f=>/\.(?:js|gs)$/.test(f)).map(f=>fs.readFileSync(path.join(dir,f),'utf8')).join('\n');
          function extract(name){
            const start=source.indexOf('function '+name+'('); if(start<0)return 'NOT_FOUND';
            const open=source.indexOf('{',start); let depth=0,quote=null,esc=false,line=false,block=false;
            for(let i=open;i<source.length;i++){
              const c=source[i],n=source[i+1]||'';
              if(line){if(c==='\n')line=false;continue;}
              if(block){if(c==='*'&&n==='/'){block=false;i++;}continue;}
              if(quote){if(esc){esc=false;continue;}if(c==='\\'){esc=true;continue;}if(c===quote)quote=null;continue;}
              if(c==='/'&&n==='/'){line=true;i++;continue;} if(c==='/'&&n==='*'){block=true;i++;continue;}
              if(c==='"'||c==="'"||c==='`'){quote=c;continue;} if(c==='{')depth++; else if(c==='}'&&--depth===0)return source.slice(start,i+1);
            }
            return 'UNTERMINATED';
          }
          for(const name of ['circuitOpen_','phase1OneJobTick','phase1OneJobTickCore_','openCircuit_','closeCircuit_']) console.log('\n=== '+name+' ===\n'+extract(name));
          NODE
      - name: Execute exactly one existing worker job
        working-directory: .janu-live
        shell: bash
        run: |
          set +e
          out="$(clasp run phase1OneJobTick --nondev --user "$CLASP_USER" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          ! grep -Eiq 'Unable to run script function|Script function not found|permission to run the script function|API executable|Execution API|Exception:|^Error:|Error 502|Server Error' <<<"$out"
