<!--
  email_template.html — Daybreak brief (reference copy)

  NOTE: In the live workflow, this HTML is generated inside the n8n "Build Email"
  Code node (it interpolates Claude's JSON fields + the run's token/cost data at
  send time). This file is the human-readable reference / starting template so the
  repo shows the markup without needing to read the node's JavaScript.

  Placeholders in {{ }} are filled by the Build Email node.
  Gmail-safe: inline styles only, table layout, static CSS gradient (Gmail strips
  @keyframes, so animation degrades to a clean static gradient).
-->
<div style="margin:0;padding:0;background:#f4f4f7">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:24px 0">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0"
             style="max-width:600px;width:100%;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif">

        <!-- Header: gradient banner -->
        <tr><td style="background:linear-gradient(120deg,#7F77DD,#F97316);border-radius:16px;padding:26px 24px">
          <div style="color:#fff;font-size:13px;opacity:.9;font-weight:600">☀️ DAYBREAK · {{ date }}</div>
          <div style="color:#fff;font-size:22px;font-weight:800;line-height:1.3;margin-top:6px">{{ hook }}</div>
        </td></tr>

        <!-- Today's one thing: dark hero card -->
        <tr><td style="padding:16px 0 4px">
          <table width="100%" cellpadding="0" cellspacing="0" style="background:#0D0D0F;border-radius:14px">
            <tr><td style="padding:20px 22px">
              <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#22C55E;font-weight:700;margin-bottom:6px">Today's one thing</div>
              <div style="color:#fff;font-size:17px;line-height:1.5;font-weight:600">{{ one_thing }}</div>
            </td></tr>
          </table>
        </td></tr>

        <!-- Weather line -->
        <tr><td style="padding:4px 6px 8px;color:#555;font-size:13px">🌦️ {{ weather_line }}</td></tr>

        <!-- Repeating section card (World Cup / Work / For you / Actionables / News / Read more).
             accent color varies: orange=#F97316, purple=#7F77DD, green=#22C55E, grey=#888 -->
        <tr><td style="padding:8px 0">
          <table width="100%" cellpadding="0" cellspacing="0"
                 style="background:#fff;border-radius:14px;border-left:4px solid {{ accent }};box-shadow:0 1px 3px rgba(0,0,0,.06)">
            <tr><td style="padding:16px 20px">
              <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:{{ accent }};font-weight:700;margin-bottom:8px">{{ section_title }}</div>
              <!-- list items -->
              <div style="margin:6px 0;color:#333;font-size:14px;line-height:1.5">• {{ item }}</div>
              <!-- read-more items render as: headline (bold) + blurb (grey) -->
            </td></tr>
          </table>
        </td></tr>

        <!-- Build footer: the PM/unit-economics line -->
        <tr><td style="padding:14px 8px;color:#999;font-size:11px;border-top:1px solid #e5e5e5">
          ⚙️ Claude Sonnet · {{ tokens_in }} in / {{ tokens_out }} out · ~{{ cost }}/run · n8n self-hosted
        </td></tr>

      </table>
    </td></tr>
  </table>
</div>
